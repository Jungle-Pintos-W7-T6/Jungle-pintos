<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Pintos — Jungle Team 06</title>
  <desc id="desc">Build the kernel. Understand the system. A dark navy banner with lime typography and a diagram of ready threads moving into a CPU.</desc>
  <defs>
