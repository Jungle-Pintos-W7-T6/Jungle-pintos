    <linearGradient id="surface" x1="0" y1="0" x2="1440" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1424"/><stop offset="1" stop-color="#141F32"/></linearGradient>
    <linearGradient id="line" x1="920" y1="250" x2="1240" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#A9A0FF"/><stop offset="1" stop-color="#D5FC79"/></linearGradient>
  </defs>
  <rect width="1440" height="500" rx="24" fill="url(#surface)"/>
  <rect width="1440" height="500" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1438" height="498" rx="23" stroke="#2A354B"/>
