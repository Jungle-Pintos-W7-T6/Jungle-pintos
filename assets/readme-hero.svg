  <text x="66" y="263" fill="#D5FC79" font-family="Arial, Helvetica, sans-serif" font-size="142" font-weight="900" letter-spacing="-8">PINTOS</text>
  <text x="76" y="322" fill="#F4F6FA" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600">Build the kernel. Understand the system.</text>
  <text x="77" y="357" fill="#9CAAC0" font-family="Arial, Helvetica, sans-serif" font-size="17">Threads, synchronization &amp; scheduling — from the inside.</text>
  <path d="M72 408H1368" stroke="#2D394E"/>
  <text x="76" y="452" fill="#DCE3EF" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">x86-64</text>
  <text x="228" y="452" fill="#8F9EB7" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.2">C / QEMU / DOCKER</text>
  <text x="1261" y="452" fill="#DCE3EF" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">27 TESTS</text>
